<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">
<title>$title</title>

<style>
:root{
  --bg:#0b0b0f;
  --card:#111118;
  --line:rgba(255,255,255,.07);
  --text:#ffffff;
  --muted:rgba(255,255,255,.62);
  --grad:linear-gradient(90deg,#7c3aed,#ec4899,#06b6d4);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at top left, rgba(124,58,237,.10), transparent 35%),
    radial-gradient(circle at bottom right, rgba(236,72,153,.08), transparent 35%),
    var(--bg);
  font-family:Inter,Segoe UI,Arial,sans-serif;
  color:var(--text);
  padding:24px;
  overflow:hidden;
}

.card{
  width:min(430px,100%);
  padding:34px 30px;
  border-radius:26px;
  background:rgba(17,17,24,.92);
  border:1px solid var(--line);
  box-shadow:
    0 20px 60px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.03);
  backdrop-filter:blur(14px);
}

.top-line{
  width:56px;
  height:4px;
  border-radius:999px;
  background:var(--grad);
  margin-bottom:24px;
}

h1{
  font-size:30px;
  font-weight:700;
  letter-spacing:-0.03em;
  margin-bottom:12px;
}

.sub{
  color:var(--muted);
  font-size:15px;
  line-height:1.6;
  margin-bottom:28px;
}

.progress-wrap{
  width:100%;
  height:8px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  overflow:hidden;
  margin-bottom:18px;
}

.progress{
  width:38%;
  height:100%;
  border-radius:999px;
  background:var(--grad);
  background-size:200% 100%;
  animation:
    move 1.8s ease-in-out infinite,
    glow 2s linear infinite;
}

.status{
  font-size:14px;
  color:rgba(255,255,255,.70);
}

.dots::after{
  content:"";
  animation:dots 1.5s infinite steps(1);
}

.footer{
  margin-top:26px;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.05);
  font-size:12px;
  color:rgba(255,255,255,.40);
  letter-spacing:.08em;
  text-transform:uppercase;
}

@keyframes move{
  0%{transform:translateX(-130%);}
  100%{transform:translateX(340%);}
}

@keyframes glow{
  0%{background-position:0% 0;}
  100%{background-position:200% 0;}
}

@keyframes dots{
  0%{content:".";}
  33%{content:"..";}
  66%{content:"...";}
  100%{content:"";}
}

@media (max-width:480px){
  .card{
    padding:28px 22px;
    border-radius:22px;
  }

  h1{
    font-size:26px;
  }

  .sub{
    font-size:14px;
  }
}
</style>
</head>

<body>
<div class="card">
  <div class="top-line"></div>

  <h1>$title</h1>

  <div class="sub">
    Please wait while we verify your session and complete the security process.
  </div>

  <div class="progress-wrap">
    <div class="progress"></div>
  </div>

  <div class="status">
    Securing account<span class="dots"></span>
  </div>

  <div class="footer">
    Secure Environment
  </div>
</div>
</body>
</html>
